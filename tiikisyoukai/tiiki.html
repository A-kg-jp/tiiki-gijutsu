    <h1 style="text-align:center"><span class="font_test">地域紹介　登別編</span></h1>

    <h2><span class="font_test">Location</span></h2>
    <p>札幌駅から車で約1時間半、JRで約2時間で到着。</p>
    <p>室蘭市と隣り合っており、洞爺湖も近い。</p>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d188403.17596923336!2d141.0801116!3d42.4532793!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5f756191d2cd8fa7%3A0x8daef4c7236d9253!2z5YyX5rW36YGT55m75Yil5biC!5e0!3m2!1sja!2sjp!4v1759147471113!5m2!1sja!2sjp" width="600" height="450" style="border:0;" allowfullscreen="0" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <h2><span class="font_test">Tourist attractions</span></h2>
    <ul>
      <li><a href="https://edo-trip.jp/">登別伊達時代村</a>…時代劇やお化け屋敷が楽しめる、定番観光スポット！</li>
      <li><a href="https://bearpark.jp/">のぼりべつクマ牧場</a>…クマと触れ合いたいならここしかない！</li>
      <li><a href="https://noboribetsu-spa.jp/spot/spot0034/">登別地獄谷</a>…谷から湧き出る煙をバックに、夏は花火を楽しめます！</li>
    </ul>
